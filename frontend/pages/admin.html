<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin catalogue | Warranty Desk</title>
	<link rel="stylesheet" href="../css/style.css">
</head>
<body class="catalogue-page">
	<header class="dashboard-header">
		<a class="brand" href="dashboard.html">Warranty Desk</a>
		<a class="text-link" href="dashboard.html">Back to dashboard</a>
	</header>

	<main class="admin-main">
		<section class="catalogue-heading">
			<p class="eyebrow">Admin workspace</p>
			<h1>Shape the catalogue.</h1>
			<p>Create categories and products that customers can discover on the website.</p>
		</section>

		<p id="admin-status" class="form-status" role="status" aria-live="polite">Loading admin catalogue...</p>

		<section class="admin-layout">
			<div class="admin-forms">
				<form id="category-form" class="admin-form">
					<h2>New category</h2>
					<label for="category-name">Name</label>
					<input id="category-name" name="name" required placeholder="Home Electronics">
					<label for="category-description">Description</label>
					<textarea id="category-description" name="description" rows="3" placeholder="A short category description"></textarea>
					<button type="submit">Create category <span aria-hidden="true">&#8594;</span></button>
				</form>

				<form id="product-form" class="admin-form">
					<h2>New product</h2>
					<label for="category-id">Category</label>
					<select id="category-id" name="category_id" required></select>
					<label for="product-name">Product name</label>
					<input id="product-name" name="name" required placeholder="Aster One">
					<label for="product-brand">Brand</label>
					<input id="product-brand" name="brand" required placeholder="Aster">
					<label for="model-number">Model number</label>
					<input id="model-number" name="model_number" required placeholder="AST-ONE-128">
					<div class="admin-form-row">
						<div>
							<label for="product-price">Price</label>
							<input id="product-price" name="price" type="number" min="0" step="0.01" required placeholder="24999">
						</div>
						<div>
							<label for="stock-quantity">Stock</label>
							<input id="stock-quantity" name="stock_quantity" type="number" min="0" required placeholder="20">
						</div>
					</div>
					<label for="product-description">Description</label>
					<textarea id="product-description" name="description" rows="3" placeholder="Describe the product"></textarea>
					<button type="submit">Create product <span aria-hidden="true">&#8594;</span></button>
				</form>
			</div>

			<section class="admin-list" aria-labelledby="product-list-heading">
				<div class="admin-list-heading">
					<p class="eyebrow">Live catalogue</p>
					<h2 id="product-list-heading">Products on site</h2>
				</div>
				<div id="admin-products"></div>
			</section>
		</section>
	</main>
	<script src="../js/admin.js"></script>
</body>
</html>
